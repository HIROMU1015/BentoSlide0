name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-browser.txt

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Build and validate deterministic demo
        run: |
          python -m scripts.build_bento --base Bento_Slides.base.bento.html --design gpt_bento_design.json --output demo.generated.bento.html
          python -m scripts.validate_bento demo.generated.bento.html --base Bento_Slides.base.bento.html
          cmp demo.generated.bento.html demo.bento.html

      - name: Build HTML-first feature matrix and evidence bundle
        run: |
          python -m scripts.build_bento_from_html --html-dir tests/fixtures/html_first --registry-dir tests/fixtures/html_first --base Bento_Slides.base.bento.html --output ci-output/presentation.bento.html
          python -m scripts.validate_bento ci-output/presentation.bento.html --base Bento_Slides.base.bento.html

      - name: Run unit, integration, and browser tests
        env:
          BENTO_BROWSER_TEST: "1"
        run: python -m unittest discover -v
