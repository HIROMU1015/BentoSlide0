<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:#d9dde5;font-family:Arial,sans-serif}.slide{position:relative;width:1280px;height:720px;overflow:hidden;background:#fff;color:#14213d}.title{position:absolute;left:64px;top:42px;width:1152px;height:64px;font-size:38px}.complex{position:absolute;padding:28px;border-radius:28px;background:linear-gradient(135deg,#3b82f6,#7c3aed);color:white;box-shadow:0 18px 40px #37415155;clip-path:polygon(0 0,100% 8%,92% 100%,5% 92%)}.card{position:absolute;background:#f4f7fb;border:2px solid #c7d2e3;border-radius:18px;padding:22px;font-size:24px}
</style></head><body>
<section class="slide" data-slide-id="complex-css">
  <h1 class="title" data-bento-id="complex-title">Complex CSS → partial SVG</h1>
  <div class="complex" data-bento-id="complex-block" data-bento-type="complex" data-bento-export="svg" style="left:240px;top:170px;width:800px;height:380px"><strong>Layered decoration</strong><br><br>Gradient, shadow, and clipping are localized to this fallback block.</div>
</section>
<section class="slide" data-slide-id="native-failure">
  <h1 class="title" data-bento-id="failure-title">Native failure → SVG fallback</h1>
  <div data-bento-id="unsupported-shape" data-bento-type="shape" data-bento-shape="hexagon" data-bento-export="native" style="position:absolute;left:440px;top:190px;width:400px;height:330px;background:#fb7185;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)"></div>
</section>
<section class="slide" data-slide-id="chapter-combine" data-layout="row">
  <h1 class="title" data-bento-id="combine-title">Chapter combination</h1>
  <div class="card" data-bento-id="combine-a" data-layout="stack" data-layout-id="combined-row" style="left:90px;top:190px;width:500px;height:300px">Chapter 01<br>native features</div>
  <div class="card" data-bento-id="combine-b" data-layout="stack" data-layout-id="combined-row" style="left:690px;top:190px;width:500px;height:300px">Chapter 02<br>fallback policy</div>
</section>
</body></html>
